<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    
    <title>Reset password - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body>
    
    <div class="auth">
      
      <div class="brand">Bushraat</div>
      
      <div class="auth-panel">
        
        <h1>Reset your password</h1>
        
        <p class="lede">Enter your account email to generate a reset link.</p>
        
        <div class="message success" th:if="${message}" th:text="${message}"></div>
        
        <div class="message success" th:if="${resetLink}">
          <a th:href="${resetLink}" th:text="${resetLink}">Reset link</a>
        </div>
        
        <form method="post" th:action="@{/forgot-password}">
          
          <div class="field">
            
            <label for="email">Email</label>
            <input id="email" name="email" required type="email">
          
          </div>
          
          <button class="btn" type="submit">Generate reset link</button>
        
        </form>
      
      </div>
      
      <p class="auth-footer">
        <a th:href="@{/login}">Back to sign in</a>
      </p>
    
    </div>
  
  </body>

</html>
