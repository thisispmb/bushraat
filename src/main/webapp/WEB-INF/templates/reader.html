<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title th:text="${book.title} + ' - Bushraat'">Reader</title>
    
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body class="reader-document" oncontextmenu="return false;">
    
    <div class="reader-progress">
      
      <div id="progressFill" th:style="${'width:' + progressPercent + '%'}"></div>
    
    </div>
    
    <header class="toolbar">
      
      <div class="toolbar-controls">
        
        <a aria-label="Back" class="icon-btn" th:href="@{/books/{id}(id=${book.id})}">‹</a>
      
      </div>
      
      <div class="toolbar-title">
        
        <h1 th:text="${book.title}">Book</h1>
      
      </div>
      
      <div class="toolbar-controls"></div>
    
    </header>
    
    <div class="reader-body">
      
      <main class="page" id="readerPage">
        
        <iframe class="pdf-frame" id="pdfFrame" th:data-page="${pdfPage}"
                th:data-pdf-url="@{/book-file/{id}(id=${book.id})}"
                title="PDF reader">
        </iframe>
      
      </main>
    
    </div>
    
    <div class="pdf-progress">
      
      <label for="pdfPage">Page</label>
      <input id="pdfPage" min="1" th:value="${pdfPage}" type="number">
      
      <button id="savePdfProgress" type="button">Save
      </button>
    
    </div>
    
    <script th:inline="javascript">
      const bookId = /*[[${book.id}]]*/ 0;
      const progressUrl = /*[[@{/progress}]]*/ '/progress';
      
      const progressFill =
          document.getElementById('progressFill');
      
      async function postProgress(page) {
        return fetch(progressUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body:
              'bookId=' + encodeURIComponent(bookId) +
              '&page=' + encodeURIComponent(page)
        });
      }
      
      const pdfFrame =
          document.getElementById('pdfFrame');
      
      if (pdfFrame) {
        const pdfUrl = pdfFrame.dataset.pdfUrl;
        const savedPage = Math.max(
            1,
            Number(pdfFrame.dataset.page) || 1
        );
        
        const viewerUrl =
            /*[[@{/pdfjs/web/viewer.html}]]*/ '/pdfjs/web/viewer.html';
        
        pdfFrame.src =
            viewerUrl +
            '?file=' + encodeURIComponent(pdfUrl) +
            '#page=' + savedPage;
      }
      
      const save =
          document.getElementById('savePdfProgress');
      
      if (save) {
        save.addEventListener('click', async () => {
          const input = document.getElementById('pdfPage');
          const page = Math.max(
              1,
              Number(input.value) || 1
          );
          
          save.disabled = true;
          
          try {
            const response = await postProgress(page);
            
            if (!response.ok) {
              throw new Error('Unable to save reading progress.');
            }
            
            input.value = page;
            save.textContent = 'Saved';
            
            if (progressFill) {
              progressFill.style.width = '0%';
            }
            
            setTimeout(() => {
              save.textContent = 'Save';
            }, 1200);
            
          } catch (error) {
            console.error(
                'Reading progress could not be saved:',
                error
            );
            
          } finally {
            save.disabled = false;
          }
        });
      }
    </script>
  
  </body>

</html>
