<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title th:text="${book.title} + ' - Bushraat'">Reader</title>
    
    <link rel="stylesheet" th:href="@{/css/main.css}">
    
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden
      }
      
      .reader-progress {
        height: 3px;
        background: var(--border)
      }
      
      .reader-progress > div {
        height: 100%;
        background: var(--accent);
        transition: width .2s
      }
      
      .toolbar {
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--surface)
      }
      
      .toolbar-title {
        min-width: 0;
        text-align: center
      }
      
      .toolbar-title h1 {
        font-size: 14px;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
      }
      
      .toolbar-controls {
        display: flex;
        align-items: center;
        gap: 7px
      }
      
      .icon-btn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink-soft);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none
      }
      
      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent)
      }
      
      .reader-body {
        height: calc(100vh - 65px);
        display: flex;
        position: relative
      }
      
      .page {
        flex: 1;
        min-width: 0;
        overflow: auto;
        background: var(--bg);
        color: var(--ink)
      }
      
      .pdf-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block
      }
      
      .pdf-progress {
        position: fixed;
        right: 18px;
        bottom: 18px;
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 7px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 5px 20px #00000010
      }
      
      .pdf-progress input {
        width: 72px;
        border: 1px solid var(--border);
        padding: 7px 8px
      }
      
      .pdf-progress button {
        min-width: 58px;
        border: 0;
        background: var(--accent);
        color: #fff;
        padding: 8px 10px;
        cursor: pointer;
        transition: opacity .15s ease
      }
      
      .pdf-progress button:disabled {
        opacity: .65;
        cursor: wait
      }
      
      @media (max-width: 720px) {
        .toolbar-title {
          max-width: 65vw
        }
      }
    </style>
  </head>
  
  <body oncontextmenu="return false;">
    
    <div class="reader-progress">
      
      <div id="progressFill" th:style="${'width:' + progressPercent + '%'}"></div>
    
    </div>
    
    <header class="toolbar">
      
      <div class="toolbar-controls">
        
        <a aria-label="Back" class="icon-btn" th:href="@{/books/{id}(id=${book.id})}">‹</a>
      
      </div>
      
      <div class="toolbar-title">
        
        <h1 th:text="${book.title}">Book</h1>
      
      </div>
      
      <div class="toolbar-controls"></div>
    
    </header>
    
    <div class="reader-body">
      
      <main class="page" id="readerPage">
        
        <iframe class="pdf-frame" id="pdfFrame"
                th:data-page="${pdfPage}"
                th:data-pdf-url="@{/book-file/{id}(id=${book.id})}"
                title="PDF reader">
        </iframe>
      
      </main>
    
    </div>
    
    <div class="pdf-progress">
      
      <label for="pdfPage">Page</label>
      <input id="pdfPage" min="1" th:value="${pdfPage}" type="number">
      
      <button id="savePdfProgress" type="button">Save
      </button>
    
    </div>
    
    <script th:inline="javascript">
      const bookId = /*[[${book.id}]]*/ 0;
      const progressUrl = /*[[@{/progress}]]*/ '/progress';
      
      const progressFill =
          document.getElementById('progressFill');
      
      async function postProgress(page) {
        return fetch(progressUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body:
              'bookId=' + encodeURIComponent(bookId) +
              '&page=' + encodeURIComponent(page)
        });
      }
      
      const pdfFrame =
          document.getElementById('pdfFrame');
      
      if (pdfFrame) {
        const pdfUrl = pdfFrame.dataset.pdfUrl;
        const savedPage = Math.max(
            1,
            Number(pdfFrame.dataset.page) || 1
        );
        
        const viewerUrl =
            /*[[@{/pdfjs/web/viewer.html}]]*/ '/pdfjs/web/viewer.html';
        
        pdfFrame.src =
            viewerUrl +
            '?file=' + encodeURIComponent(pdfUrl) +
            '#page=' + savedPage;
      }
      
      const save =
          document.getElementById('savePdfProgress');
      
      if (save) {
        save.addEventListener('click', async () => {
          const input = document.getElementById('pdfPage');
          const page = Math.max(
              1,
              Number(input.value) || 1
          );
          
          save.disabled = true;
          
          try {
            const response = await postProgress(page);
            
            if (!response.ok) {
              throw new Error('Unable to save reading progress.');
            }
            
            input.value = page;
            save.textContent = 'Saved';
            
            if (progressFill) {
              progressFill.style.width = '0%';
            }
            
            setTimeout(() => {
              save.textContent = 'Save';
            }, 1200);
            
          } catch (error) {
            console.error(
                'Reading progress could not be saved:',
                error
            );
            
          } finally {
            save.disabled = false;
          }
        });
      }
    </script>
  
  </body>

</html>
