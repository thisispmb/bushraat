<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title>Create account - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body>
    
    <div class="auth">
      
      <div class="brand">
        
        <svg fill="none" height="22" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" width="22">
          
          <path d="M6 3h9a3 3 0 0 1 3 3v15l-6-3.5L6 21V3z"/>
        
        </svg>
        
        Bushraat
      
      </div>
      
      <div class="auth-panel">
        
        <h1>Create your account</h1>
        
        <p class="lede">Start building your own shelf.</p>
        
        <div class="message error" th:if="${error}" th:text="${error}">
          That email is already registered.
        </div>
        
        <form method="post" th:action="@{/register}">
          
          <div class="field">
            
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Your name" required th:value="${name}" type="text">
          
          </div>
          
          <div class="field">
            
            <label for="email">Email</label>
            <input id="email" name="email" placeholder="you@example.com" required th:value="${email}" type="email">
          
          </div>
          
          <div class="field">
            
            <label for="password">Password</label>
            
            <div class="password-wrapper">
              
              <input id="password" name="password" placeholder="Create a password" required type="password">
              
              <button aria-label="Show password" class="password-toggle" data-target="password" type="button">
                
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                
                </svg>
              
              </button>
            
            </div>
          
          </div>
          
          <button class="btn" type="submit">Create account</button>
        
        </form>
      
      </div>
      
      <p class="auth-footer">
        Already have an account?
        <a th:href="@{/login}">Sign in</a>
      </p>
    
    </div>
    
    <script th:src="@{/js/main.js}"></script>
  
  </body>

</html>
