<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    
    <title>Choose a new password - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body>
    
    <div class="auth">
      
      <div class="brand">Bushraat</div>
      
      <div class="auth-panel">
        
        <h1>Choose a new password</h1>
        
        <p class="lede">Use at least 8 characters.</p>
        
        <div class="message error" th:if="${error}" th:text="${error}"></div>
        
        <form method="post" th:action="@{/reset-password}">
          
          <input name="token" th:value="${token}" type="hidden">
          
          <div class="field">
            
            <label for="password">New password</label>
            
            <div class="password-wrapper">
              
              <input id="password" minlength="8" name="password" required type="password">
              
              <button aria-label="Show password" class="password-toggle" data-target="password" type="button">
                
                <svg viewBox="0 0 24 24">
                  
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                
                </svg>
              
              </button>
            
            </div>
          
          </div>
          
          <button class="btn" type="submit">Set new password</button>
        
        </form>
      
      </div>
    
    </div>
    
    <script th:src="@{/js/main.js}"></script>
  
  </body>

</html>
