<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title>Dashboard - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body>
    
    <div class="layout">
      
      <aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside>
      
      <main class="main">
        
        <div class="content dashboard-content">
          
          <section class="welcome-block">
            
            <div>
              <p class="eyebrow">YOUR DIGITAL LIBRARY</p>
              
              <h1>
                Welcome back
                <span th:if="${user != null}">,
                  <span th:text="${user.name}">Reader</span>
                </span>.
              </h1>
              
              <p>Discover something worth reading today.</p>
            </div>
            
            <form class="search" method="get" th:action="@{/dashboard}">
              
              <svg fill="none" height="17" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="17">
                
                <circle cx="11" cy="11" r="7"/>
                <path d="m21 21-4.3-4.3"/>
              
              </svg>
              
              <input autocomplete="off" name="query"
                     placeholder="Search title, author or category"
                     th:value="${query}" type="search">
              
              <button aria-label="Search" type="submit">
                
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                  
                  <path d="M5 12h14M13 6l6 6-6 6"/>
                
                </svg>
              
              </button>
            
            </form>
          
          </section>
          
          <section class="dashboard-section">
            
            <div class="section-head">
              
              <h2 th:text="${query != null and !query.isBlank() ? 'Search results' : 'Available books'}">
                Available books
              </h2>
              
              <div class="section-actions">
                
                <a class="section-link" th:href="@{/continue-reading}"
                   th:if="${readingBooks != null and !#lists.isEmpty(readingBooks)}">
                  Continue reading
                </a>
              
              </div>
            
            </div>
            
            <div class="empty" th:if="${books == null or #lists.isEmpty(books)}">
              
              <h2>No books found</h2>
              
              <p th:text="${query != null and !query.isBlank() ? 'Try a different title, author or category.' : 'The library is waiting for its first book.'}">
                Try a different search.
              </p>
            
            </div>
            
            <div class="book-grid" id="bookGrid" th:unless="${books == null or #lists.isEmpty(books)}">
              
              <th:block th:replace="~{fragments/book-cards :: cards}"></th:block>
            
            </div>
          
          </section>
        
        </div>
      
      </main>
    
    </div>
    
    <script th:inline="javascript">
      const bookGrid = document.getElementById('bookGrid');
      
      let currentPage = /*[[${currentPage}]]*/ 1;
      let hasMore = /*[[${hasMore}]]*/ false;
      let loading = false;
      
      const query = /*[[${query}]]*/ '';
      
      const loadMoreBooks = async () => {
        if (!bookGrid || !hasMore || loading) {
          return;
        }
        
        loading = true;
        
        const nextPage = currentPage + 1;
        
        try {
          const params = new URLSearchParams();
          
          params.set('page', nextPage);
          
          if (query && query.trim()) {
            params.set('query', query.trim());
          }
          
          const response = await fetch(
              /*[[@{/dashboard/books}]]*/ '/dashboard/books'
              + '?' + params.toString()
          );
          
          if (!response.ok) {
            throw new Error('Unable to load more books.');
          }
          
          const html = await response.text();
          
          if (!html.trim()) {
            hasMore = false;
            return;
          }
          
          const template = document.createElement('template');
          template.innerHTML = html;
          
          bookGrid.appendChild(template.content);
          
          currentPage = nextPage;
          
          const loadedCards =
              template.content.querySelectorAll('.book-card').length;
          
          if (loadedCards < /*[[${pageSize}]]*/ 20) {
            hasMore = false;
          }
          
        } catch (error) {
          console.error('Unable to load more books:', error);
          
        } finally {
          loading = false;
        }
      };
      
      const scrollSentinel = document.createElement('div');
      
      scrollSentinel.setAttribute(
          'aria-hidden',
          'true'
      );
      
      scrollSentinel.style.height = '1px';
      
      if (bookGrid) {
        bookGrid.after(scrollSentinel);
        
        const observer = new IntersectionObserver(
            entries => {
              if (entries[0].isIntersecting) {
                loadMoreBooks();
              }
            },
            {rootMargin: '500px'}
        );
        
        observer.observe(scrollSentinel);
      }
    </script>
  
  </body>

</html>
