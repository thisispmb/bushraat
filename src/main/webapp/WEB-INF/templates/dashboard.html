<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title>Dashboard - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body>
    
    <div class="layout">
      
      <aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside>
      
      <main class="main">
        
        <div class="content dashboard-content">
          
          <section class="welcome-block">
            
            <div>
              <p class="eyebrow">YOUR DIGITAL LIBRARY</p>
              
              <h1>
                Welcome back
                <span th:if="${user != null}">,
                  <span th:text="${user.name}">Reader</span>
                </span>.
              </h1>
              
              <p>Discover something worth reading today.</p>
            </div>
            
            <form class="search" method="get" th:action="@{/dashboard}">
              
              <svg fill="none" height="17" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="17">
                
                <circle cx="11" cy="11" r="7"/>
                <path d="m21 21-4.3-4.3"/>
              
              </svg>
              
              <input autocomplete="off" name="query"
                     placeholder="Search title, author or category"
                     th:value="${query}" type="search">
              
              <button aria-label="Search" type="submit">
                
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                  
                  <path d="M5 12h14M13 6l6 6-6 6"/>
                
                </svg>
              
              </button>
            
            </form>
          
          </section>
          
          <section class="dashboard-section">
            
            <div class="section-head">
              
              <h2 th:text="${query != null and !query.isBlank() ? 'Search results' : 'Available books'}">
                Available books
              </h2>
              
              <div class="section-actions">
                
                <span th:text="${books != null ? books.size() : 0} + ' books'">0 books</span>
                
                <a class="section-link" th:href="@{/continue-reading}"
                   th:if="${readingBooks != null and !#lists.isEmpty(readingBooks)}">
                  Continue reading
                </a>
              
              </div>
            
            </div>
            
            <div class="empty" th:if="${books == null or #lists.isEmpty(books)}">
              
              <h2>No books found</h2>
              
              <p th:text="${query != null and !query.isBlank() ? 'Try a different title, author or category.' : 'The library is waiting for its first book.'}">
                Try a different search.
              </p>
            
            </div>
            
            <div class="book-grid" th:unless="${books == null or #lists.isEmpty(books)}">
              
              <article class="book-card" th:each="book : ${books}">
                
                <a th:href="@{/books/{id}(id=${book.id})}">
                  
                  <div class="book-cover">
                    
                    <img th:alt="${book.title}"
                         th:if="${book.coverImagePath != null and !book.coverImagePath.isBlank()}"
                         th:src="@{/books/{id}/cover(id=${book.id})}">
                    
                    <span th:text="${book.title}"
                          th:unless="${book.coverImagePath != null and !book.coverImagePath.isBlank()}">
                      Book Title
                    </span>
                  
                  </div>
                  
                  <p class="book-title" th:text="${book.title}">Book Title</p>
                
                </a>
                
                <p class="book-author" th:text="${book.author}">Author Name</p>
                
                <form method="post" th:action="@{/save}" th:if="${!savedBookIds.contains(book.id)}">
                  
                  <input name="bookId" th:value="${book.id}" type="hidden">
                  <input name="redirect" th:value="${requestUri}" type="hidden">
                  
                  <button class="btn btn-ghost btn-sm" type="submit">Save book</button>
                
                </form>
                
                <form method="post" th:action="@{/unsave}" th:if="${savedBookIds.contains(book.id)}">
                  
                  <input name="bookId" th:value="${book.id}" type="hidden">
                  <input name="redirect" th:value="${requestUri}" type="hidden">
                  
                  <button class="btn btn-ghost btn-sm" type="submit">Saved</button>
                
                </form>
              
              </article>
            
            </div>
          
          </section>
        
        </div>
      
      </main>
    
    </div>
  
  </body>

</html>
