<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title>Saved books - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
  
  <body>
    
    <div class="layout">
      
      <aside th:replace="~{fragments/sidebar :: sidebar('saved')}"></aside>
      
      <main class="main">
        
        <div class="content">
          
          <div class="page-head">
            <h1>Saved books</h1>
            <p>The titles you've set aside to come back to.</p>
          </div>
          
          <div class="empty" th:if="${savedBooks == null or #lists.isEmpty(savedBooks)}">
            
            <svg fill="none" height="34" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24" width="34">
              
              <path d="M6 3h9a3 3 0 0 1 3 3v15l-6-3.5L6 21V3z"/>
            
            </svg>
            
            <h2>Your shelf is empty</h2>
            
            <p>Books you save from the library will show up here.</p>
            
            <a class="btn btn-inline" th:href="@{/dashboard}">Browse the library</a>
          
          </div>
          
          <div class="book-grid" th:unless="${savedBooks == null or #lists.isEmpty(savedBooks)}">
            
            <div class="book-card" th:each="book : ${savedBooks}">
              
              <a th:href="@{/books/{id}(id=${book.id})}">
                
                <div class="book-cover">
                  
                  <img th:alt="${book.title}"
                       th:if="${book.coverImagePath != null and !book.coverImagePath.isBlank()}"
                       th:src="@{/books/{id}/cover(id=${book.id})}">
                  
                  <span th:text="${book.title}"
                        th:unless="${book.coverImagePath != null and !book.coverImagePath.isBlank()}">
                    Book Title
                  </span>
                
                </div>
                
                <p class="book-title" th:text="${book.title}">Book Title</p>
              
              </a>
              
              <p class="book-author" th:text="${book.author}">Author Name</p>
              
              <form method="post" th:action="@{/unsave}">
                
                <input name="bookId" th:value="${book.id}" type="hidden">
                <input name="redirect" th:value="${requestUri}" type="hidden">
                
                <button class="btn btn-ghost btn-sm" type="submit">Remove</button>
              
              </form>
            
            </div>
          
          </div>
        
        </div>
      
      </main>
    
    </div>
  
  </body>
</html>
