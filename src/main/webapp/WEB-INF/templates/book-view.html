<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title th:text="${book.title} + ' - Bushraat'">Book - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    
    <style>
      .book-page {
        max-width: 1120px;
        margin: 0 auto;
      }
      
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 32px;
        color: var(--ink-soft);
        font-size: 14px;
        text-decoration: none;
        transition: color .15s ease;
      }
      
      .back-link:hover {
        color: var(--accent);
      }
      
      .book-detail {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 52px;
        align-items: start;
      }
      
      .book-cover-large {
        width: 260px;
        aspect-ratio: 3 / 4;
        overflow: hidden;
        border-radius: 5px;
        background: var(--accent-soft);
        border: 1px solid var(--border);
        box-shadow: 0 10px 28px rgba(0, 0, 0, .08);
      }
      
      .book-cover-large img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      .book-cover-placeholder {
        width: 100%;
        height: 100%;
        padding: 22px;
        display: flex;
        align-items: flex-end;
        background: var(--accent);
        color: #fff;
        font: 21px/1.3 var(--serif);
      }
      
      .book-info {
        min-width: 0;
        padding-top: 4px;
      }
      
      .book-info h1 {
        margin: 0 0 7px;
        font: normal 36px/1.15 var(--serif);
        letter-spacing: -.3px;
      }
      
      .book-author {
        margin: 0 0 30px;
        color: var(--ink-soft);
        font-size: 15px;
      }
      
      .book-author span {
        color: var(--ink);
      }
      
      .meta-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(100px, 1fr));
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        margin-bottom: 28px;
      }
      
      .meta-item {
        padding: 16px 18px 16px 0;
      }
      
      .meta-item + .meta-item {
        border-left: 1px solid var(--border);
        padding-left: 18px;
      }
      
      .meta-item .label {
        margin: 0 0 5px;
        color: var(--ink-soft);
        font-size: 12px;
      }
      
      .meta-item .value {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      
      .description {
        max-width: 68ch;
        margin: 0 0 30px;
        color: var(--ink-soft);
        font-size: 15px;
        line-height: 1.75;
      }
      
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      
      .actions form {
        margin: 0;
      }
      
      .actions .btn {
        min-width: 145px;
      }
      
      @media (max-width: 820px) {
        .book-detail {
          grid-template-columns: 200px minmax(0, 1fr);
          gap: 32px;
        }
        
        .book-cover-large {
          width: 200px;
        }
        
        .book-info h1 {
          font-size: 30px;
        }
      }
      
      @media (max-width: 650px) {
        .book-detail {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        
        .book-cover-large {
          width: 210px;
          margin: 0 auto;
        }
        
        .book-info h1 {
          font-size: 28px;
        }
        
        .meta-row {
          grid-template-columns: 1fr;
        }
        
        .meta-item {
          padding: 14px 0;
        }
        
        .meta-item + .meta-item {
          border-left: 0;
          border-top: 1px solid var(--border);
          padding-left: 0;
        }
        
        .actions {
          flex-direction: column;
          align-items: stretch;
        }
        
        .actions .btn,
        .actions form {
          width: 100%;
        }
      }
    </style>
  </head>
  
  <body>
    
    <div class="layout">
      
      <aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside>
      
      <main class="main">
        
        <div class="content book-page">
          
          <a class="back-link" th:href="@{/dashboard}">
            
            <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
            
            Back to library
          
          </a>
          
          <div class="book-detail">
            
            <div class="book-cover-large">
              
              <img th:alt="${book.title}"
                   th:if="${book.coverImagePath != null and !book.coverImagePath.isBlank()}"
                   th:src="@{/books/{id}/cover(id=${book.id})}">
              
              <span class="book-cover-placeholder"
                    th:text="${book.title}"
                    th:unless="${book.coverImagePath != null and !book.coverImagePath.isBlank()}">
                        Book Title
              </span>
            
            </div>
            
            <div class="book-info">
              
              <h1 th:text="${book.title}">Book Title</h1>
              
              <p class="by">by
                <span th:text="${book.author}">Author Name</span>
              </p>
              
              <div class="meta-row">
                
                <div class="meta-item">
                  
                  <p class="label">Category</p>
                  <p class="value"
                     th:text="${book.category != null ? book.category.name : 'Uncategorized'}">
                    Programming
                  </p>
                
                </div>
                
                <div class="meta-item">
                  
                  <p class="label">Format</p>
                  <p class="value" th:text="${book.fileType}">PDF</p>
                
                </div>
                
                <div class="meta-item">
                  
                  <p class="label">Added</p>
                  <p class="value"
                     th:text="${#temporals.format(book.uploadedAt, 'dd MMM yyyy')}">
                    12 Sep 2026
                  </p>
                
                </div>
              
              </div>
              
              <p class="description"
                 th:text="${book.description}">
                A clear, practical guide that walks through the fundamentals step by step,
                with examples drawn from real projects rather than abstract theory.
              </p>
              
              <div class="actions">
                
                <a class="btn btn-inline" th:href="@{/read/{id}(id=${book.id})}">Read now</a>
                
                <form method="post" th:action="@{/save}" th:if="${!book.saved}">
                  
                  <input name="bookId" th:value="${book.id}" type="hidden">
                  <input name="redirect" th:value="${requestUri}" type="hidden">
                  
                  <button class="btn btn-ghost btn-inline" type="submit">Save for later</button>
                
                </form>
                
                <form method="post" th:action="@{/unsave}" th:if="${book.saved}">
                  
                  <input name="bookId" th:value="${book.id}" type="hidden">
                  <input name="redirect" th:value="${requestUri}" type="hidden">
                  
                  <button class="btn btn-ghost btn-inline" type="submit">Remove from saved</button>
                
                </form>
              
              </div>
            
            </div>
          
          </div>
        
        </div>
      
      </main>
    
    </div>
  
  </body>

</html>
