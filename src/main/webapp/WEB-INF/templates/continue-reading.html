<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title>Continue Reading - Bushraat</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
  </head>
  
  <body>
    
    <div class="layout">
      
      <aside th:replace="~{fragments/sidebar :: sidebar('continue')}"></aside>
      
      <main class="main">
        
        <div class="content">
          
          <div class="page-head">
            <h1>Continue reading</h1>
            <p>Pick up exactly where you left off.</p>
          </div>
          
          <div class="empty" th:if="${readingBooks == null or #lists.isEmpty(readingBooks)}">
            
            <svg fill="none" height="34" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24" width="34">
              
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7.5v5l3 2"/>
            
            </svg>
            
            <h2>Nothing to continue yet</h2>
            
            <p>Open a book and save your reading position to see it here.</p>
            
            <a class="btn btn-inline" th:href="@{/dashboard}">Browse the library</a>
          
          </div>
          
          <div class="reading-grid" th:unless="${readingBooks == null or #lists.isEmpty(readingBooks)}">
            
            <article class="reading-card" th:each="book : ${readingBooks}">
              
              <a class="reading-cover" th:href="@{/read/{id}(id=${book.id}, page=${book.lastPageRead})}">
                
                <img th:alt="${book.title}"
                     th:if="${book.coverImagePath != null and !book.coverImagePath.isBlank()}"
                     th:src="@{/books/{id}/cover(id=${book.id})}">
                
                <span th:text="${book.title}"
                      th:unless="${book.coverImagePath != null and !book.coverImagePath.isBlank()}">
                  Book title
                </span>
                
                <div aria-hidden="true" class="reading-progress-track">
                  
                  <div class="reading-progress-fill"></div>
                
                </div>
              
              </a>
              
              <div class="reading-body">
                
                <p class="reading-format">PDF</p>
                
                <h2 th:text="${book.title}">Book title</h2>
                
                <p class="reading-author" th:text="${book.author}">Author</p>
                
                <p class="reading-description"
                   th:if="${book.description != null and !book.description.isBlank()}"
                   th:text="${book.description}">
                  A short summary of the book goes here.
                </p>
                
                <div class="reading-position">
                  
                  <div class="reading-position-row">
                    
                    <span>Saved at page</span>
                    
                    <strong th:text="${book.lastPageRead}">8</strong>
                  
                  </div>
                  
                  <div class="reading-actions">
                    
                    <a class="btn btn-ghost reading-continue"
                       th:href="@{/read/{id}(id=${book.id}, page=${book.lastPageRead})}">
                      
                      <span>Continue reading</span>
                      
                      <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                           width="14">
                        
                        <path d="M9 6l6 6-6 6"/>
                      
                      </svg>
                    
                    </a>
                    
                    <form class="reading-clear-form" method="post" th:action="@{/progress/clear}">
                      
                      <input name="bookId" th:value="${book.id}" type="hidden">
                      
                      
                      <!-- btn btn-ghost reading-continue-->
                      <button class="btn btn-ghost reading-clear" type="submit">Clear progress</button>
                    
                    </form>
                  
                  </div>
                
                </div>
              
              </div>
            
            </article>
          
          </div>
        
        </div>
      
      </main>
    
    </div>
  
  </body>
</html>
