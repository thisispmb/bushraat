<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  
  <body>
    
    <aside class="sidebar" th:fragment="sidebar(page)">
      
      <div class="brand">
        
        <svg fill="none" height="20" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" width="20">
          
          <path d="M6 3h9a3 3 0 0 1 3 3v15l-6-3.5L6 21V3z"/>
        
        </svg>
        
        Bushraat
      
      </div>
      
      <button class="mobile-menu-toggle"
              type="button"
              aria-label="Open navigation"
              aria-expanded="false"
              onclick="const sidebar=this.closest('.sidebar'); const open=sidebar.classList.toggle('nav-open'); this.setAttribute('aria-expanded', open); this.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');">
        <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" viewBox="0 0 24 24" width="20" aria-hidden="true">
          <path d="M4 7h16"/>
          <path d="M4 12h16"/>
          <path d="M4 17h16"/>
        </svg>
      </button>

      <nav class="nav">
        
        <a class="nav-link" th:classappend="${page == 'home'} ? ' active'" th:href="@{/dashboard}">
          
          <svg fill="none" height="17" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" width="17">
            
            <path d="M4 11.5 12 4l8 7.5"/>
            <path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>
          
          </svg>
          
          <span>Home</span>
        
        </a>
        
        <a class="nav-link" th:classappend="${page == 'continue'} ? ' active'" th:href="@{/continue-reading}">
          
          <svg fill="none" height="17" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" width="17">
            
            <path d="M6 4.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2V20l-6-3.5L6 20V4.5z"/>
            <path d="M9.5 8.5h5M9.5 11.5h5"/>
          
          </svg>
          
          <span>Continue Reading</span>
        
        </a>
        
        <a class="nav-link" th:classappend="${page == 'saved'} ? ' active'" th:href="@{/saved}">
          
          <svg fill="none" height="17" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" width="17">
            
            <path d="M6 3h9a3 3 0 0 1 3 3v15l-6-3.5L6 21V3z"/>
          
          </svg>
          
          <span>Saved Books</span>
        
        </a>
        
        <a class="nav-link" th:classappend="${page == 'profile'} ? ' active'" th:href="@{/profile}">
          
          <svg fill="none" height="17" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" width="17">
            
            <circle cx="12" cy="8" r="3.6"/>
            <path d="M4.5 20c0-4 3.5-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>
          
          </svg>
          
          <span>Profile</span>
        
        </a>
        
        <a class="nav-link" th:href="@{/admin}" th:if="${isAdmin}">
          
          <svg fill="none" height="17" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" width="17">
            
            <rect height="7" rx="1" width="7" x="4" y="4"/>
            <rect height="7" rx="1" width="7" x="13" y="4"/>
            <rect height="7" rx="1" width="7" x="4" y="13"/>
            <rect height="7" rx="1" width="7" x="13" y="13"/>
          
          </svg>
          
          <span>Admin</span>
        
        </a>
      
      </nav>
    
    </aside>
  
  </body>

</html>
